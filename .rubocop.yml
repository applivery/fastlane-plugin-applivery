AllCops:
  TargetRubyVersion: 2.6
  NewCops: disable
  SuggestExtensions: false
  Include:
    - '**/*.rb'
    - '**/*.gemspec'
    - '**/fastlane/Fastfile'
  Exclude:
    - 'vendor/**/*'
    - 'gemfiles/**/*'

# fastlane's own code style, kept so the plugin looks like the actions it lives with.

# kind_of? is a good way to check a type
Style/ClassCheck:
  EnforcedStyle: kind_of?

# The options of an action are indented, not aligned with the first argument
Layout/ArgumentAlignment:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/FirstHashElementIndentation:
  Enabled: false

# Trailing comments are aligned to document the options of a lane
Layout/ExtraSpacing:
  AllowForAlignment: true
  AllowBeforeTrailingComments: true

# The specs reopen STDERR to capture what the git subprocesses print
Style/GlobalStdStream:
  Enabled: false

# `get_base_domain` and `get_integration_number` are part of the helper API
Naming/AccessorMethodName:
  Enabled: false

# We use `is_supported?` everywhere already
Naming/PredicateName:
  Enabled: false

# e.g. `def self.is_supported?(platform)`, we may never use `platform`
Lint/UnusedMethodArgument:
  Enabled: false

# specs sometimes have useless assignments, which is fine
Lint/UselessAssignment:
  Exclude:
    - 'spec/**/*'

# We allow both " and '
Style/StringLiterals:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: false

# Better too much 'return' than one missing
Style/RedundantReturn:
  Enabled: false

# Better to have too much self than missing a self
Style/RedundantSelf:
  Enabled: false

# and and or is okay
Style/AndOr:
  Enabled: false

# We want to allow class Fastlane::Class
Style/ClassAndModuleChildren:
  Enabled: false

# Sometimes it's easier to read without guards
Style/GuardClause:
  Enabled: false

# Having if in the same line might not always be good
Style/IfUnlessModifier:
  Enabled: false

# something = if something_else - that's confusing
Style/ConditionalAssignment:
  Enabled: false

# We're not there yet
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

# The %w might be confusing for new users
Style/WordArray:
  MinSize: 19

Style/SymbolArray:
  Enabled: false

# Long user facing messages read better on a single line
Layout/LineLength:
  Max: 250

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false
